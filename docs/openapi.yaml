      tags: [Analytics]
      summary: Realtime refetch hint (SSE)
      description: |
        One-way event stream. SSE is a hint to refetch the Read Model, never
        the source of historical truth.
      responses:
        '200':
          description: The text/event-stream stream carries analytics.events events.
          content:
            text/event-stream:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Set when server.auth_token is configured; empty disables auth for local dev.
  parameters:
    WorkspaceId:
      name: workspace_id
      in: query
      required: false
      schema: { type: string }
      description: Defaults to `default`; a token-bound deployment overrides it.
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TraceId:
      name: trace_id
      in: path
      required: true
      schema: { type: string }
    TimeRange:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
      description: RFC3339 (`Z` or numeric offset); normalized to UTC server-side.
    Interval:
      name: interval
      in: query
      required: false
      schema: { type: string, enum: [minute, hour, day, week, month], default: day }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
  responses:
    ValidationError:
      description: Request rejected before execution.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist or is not visible to the caller's workspace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ContentTooLarge:
      description: Document exceeds the configured ingest bound.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        version: { type: string, example: 0.2.0 }
        index:
          type: object
          properties:
            fulltext_backend: { type: string }
            fulltext_chunks: { type: integer }
            tantivy_chunks: { type: integer }
            sqlite_chunks: { type: integer }
            consistent: { type: boolean }
        providers:
          type: array
          items: { type: string }
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        mode:
          type: string
          enum: [local-only, local-first, hybrid, external-only, external-first]
          default: local-first
        profile: { type: string }
        workspace_id: { type: string }
        request_id:
          type: string
          description: Idempotency key; replaying it must not create a second task, call or bill.
        max_results: { type: integer, minimum: 1 }
        max_external_queries: { type: integer, minimum: 0 }
        max_total_cost: { type: number, format: double }
        as_of:
          type: string
          format: date-time
          description: >
            RFC-057: judge freshness as of this instant instead of wall-clock
            now. Documents fetched after the instant are excluded from the
            historical view; invalid RFC3339 is a client error.
        max_acquisition_rounds:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: Bounded iterative acquisition rounds; total query and cost caps stay cumulative.
        session_id:
          type: string
          description: Agent session id; turns are recorded so a follow-up can target the open requirements.
        focus_requirements:
          type: array
          items: { type: string }
          description: Explicit requirements for a follow-up turn; replaces the derived decomposition.
        context_budget:
          $ref: '#/components/schemas/ContextBudget'
          description: >-
            Caller-declared context budget (RFC-067/068). When present the
            response carries an Agent-facing `context` block: deduplicated
            evidence, preserved citations and an honest truncation status.
    SearchResponse:
      type: object
      required: [query, results, status]
      properties:
        query: { type: string }
        status:
          type: string
          enum: [completed, completed_with_warnings, partial, insufficient_evidence, budget_exhausted, failed, cancelled]
        decision:
          type: object
          properties:
            path: { type: string }
            reason: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResultItem' }
        quality:
          type: object
          properties:
            status: { type: string, enum: [passed, partial, failed, conflict, unknown] }
            freshness: { type: string }
            coverage: { type: string }
            score: { type: number, format: float }
            failed_constraints:
              type: array
              items: { type: string }
        cost:
          type: object
          properties:
            estimated: { type: integer, format: int64 }
            actual: { type: integer, format: int64, nullable: true }
            currency: { type: string }
        provenance:
          type: array
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string }
        trace_id: { type: string }
        task_id: { type: string, nullable: true }
        replayed: { type: boolean }
        session_id:
          type: string
          nullable: true
          description: Agent session this turn belongs to.
        focus_requirements:
          type: array
          items: { type: string }
          description: Open requirements a follow-up turn should target.
        context:
          allOf:
            - $ref: '#/components/schemas/ContextBlockSummary'
          nullable: true
          description: >-
            Agent-facing context assembled under the request's
            `context_budget`. Present only when the caller declared one; the
            raw `results` and `provenance` remain the untruncated contract.
        coverage_gaps:
          description: >-
            Sub-questions the final quality gate found uncovered. This is the
            agent-facing contract for "what is still missing": each entry
            carries the open question, its coverage state, resolution
            priority, minimal acquisition strategy and a stable requirement
            id so a follow-up query can target it directly.
          type: array
          items:
            type: object
            required: [question, missing_kind, requirement_id]
            properties:
              question: { type: string }
              missing_kind: { type: string }
              status: { type: string }
              priority: { type: string }
              strategy: { type: string }
              requirement_id: { type: string }
        # Present only when the request was routed through the Tavily
        # compatibility layer. Always an array, possibly empty.
        unsupported_features:
          type: array
          items: { type: string }
        # Tavily compatibility: always null (SearchOS never fabricates an answer).
        answer: { type: string, nullable: true }
        response_time: { type: number, format: double }
    SearchPlanReport:
      type: object
      required: [query, planned_queries, estimated_cost_micros]
      properties:
        query: { type: string }
        mode: { type: string }
        decision_path: { type: string }
        decision_reason: { type: string }
        local_candidates: { type: integer, format: int64 }
        required_requirements:
          type: array
          items: { type: string }
        open_requirements:
          type: array
          items:
            type: object
            additionalProperties: true
        planned_queries:
          type: array
          items:
            type: object
            required: [query]
            properties:
              query: { type: string }
              requirement_id: { type: string }
              strategy: { type: string }
        estimated_cost_micros: { type: integer, format: int64 }
        federation_strategy:
          type: string
          nullable: true
          enum: [auto, parallel, sequential, selective, null]
          description: >-
            RFC-062 planner strategy used for this plan. Null means the legacy
            pipeline is authoritative and no federated plan was produced.
        federated_sources:
          type: array
          items: { type: string }
          description: Selected source ids in execution order, empty in legacy mode.
        source_selection:
          type: string
          nullable: true
          enum: [reliability_first, cost_adaptive, null]
          description: >-
            RFC-080 ordering policy used by the planner. Null means the legacy
            pipeline is authoritative and no federated plan was produced.
        source_scores:
          type: array
          items: { $ref: "#/components/schemas/SourceSelectionScore" }
          description: >-
            RFC-080 per-source score for every eligible source, selected or
            not, so the ordering decision can be reviewed after the fact.

        currency: { type: string }
    WatchReport:
      type: object
      description: >-
        RFC-035 watchdog result. `status` is worst-wins across `checks`.
        A check with status `skipped` means the signal was unavailable, not
        that it passed.
      required: [id, ran_at, workspace_id, status, checks]
      properties:
        id: { type: string }
        ran_at: { type: string, format: date-time }
        workspace_id: { type: string }
        status: { type: string, enum: [pass, skipped, degraded, regressed] }
        checks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind:
                type: string
                enum: [quality_floor, failure_rate, quality_regression, ranking]
              status: { type: string, enum: [pass, skipped, degraded, regressed] }
              observed: { type: number, format: double, nullable: true }
              threshold: { type: number, format: double, nullable: true }
              detail: { type: string }
        signals:
          type: object
          nullable: true
          properties:
            total_searches: { type: integer }
            failed_searches: { type: integer }
            quality_pass_rate: { type: number }
            quality_denominator: { type: integer }
        ranking: { type: object, nullable: true }
        persistence_error: { type: string, nullable: true }
    SourceSelectionScore:
      type: object
      description: >-
        RFC-080 score of one eligible source under cost-adaptive selection.
        `expected_quality` blends the observed success rate with the
        declared metadata trust; `value_density` is the expected quality per
        million micro units (free sources use the maximum finite value).
      required: [source_id, expected_quality, cost_micros, value_density, selected]
      properties:
        source_id: { type: string }
        expected_quality: { type: number, format: float }
        cost_micros: { type: integer, format: int64 }
        value_density: { type: number, format: double }
        selected: { type: boolean }
    ContextBudget:
      type: object
      description: >-
        Caller-declared budget for one assembled context (RFC-068). Citations
        are reserved before content; compression never deletes a source.
      required: [max_tokens]
      properties:
        max_tokens: { type: integer, minimum: 1, default: 8000 }
        reserved_tokens: { type: integer, minimum: 0, default: 1000 }
        max_sources: { type: integer, minimum: 1, default: 12 }
        max_chunks_per_source: { type: integer, minimum: 1, default: 3 }
        deduplicate: { type: boolean, default: true }
        preserve_citations: { type: boolean, default: true }
        include_conflicts: { type: boolean, default: true }
    ContextBlockSummary:
      type: object
      description: >-
        The Agent-facing context block (RFC-067). `used_tokens` never exceeds
        `usable_tokens`; content is always a verbatim prefix of the original
        text (never a generated summary); `status` is never `complete` when
        anything was truncated or dropped.
      required: [status, max_tokens, usable_tokens, used_tokens, truncated, evidence, citations]
      properties:
        status:
          type: string
          enum: [complete, budget_limited, citation_limited]
        max_tokens: { type: integer }
        reserved_tokens: { type: integer }
        usable_tokens: { type: integer }
        used_tokens: { type: integer }
        truncated: { type: boolean }
        citations:
          type: array
          items: { type: string }
          description: One citation per surviving evidence entry, in evidence order.
        evidence:
          type: array
          items:
            type: object
            required: [citation, source_id, content, truncated, conflicting, occurrences, estimated_tokens]
            properties:
              citation: { type: string }
              source_id: { type: string }
              title: { type: string, nullable: true }
              content:
                type: string
                description: Verbatim original text or a verbatim prefix; empty when only the citation survived.
              truncated: { type: boolean }
              conflicting: { type: boolean }
              occurrences:
                type: integer
                description: Source observations merged into this entry. Provenance, not independence.
              estimated_tokens: { type: integer }
        dropped:
          type: array
          items:
            type: object
            required: [chunk_id, source_id, canonical_ref, reason]
            properties:
              chunk_id: { type: string }
              source_id: { type: string }
              canonical_ref: { type: string }
              reason:
                type: string
                enum: [permission_denied, duplicate, conflict_excluded, source_cap, chunks_per_source_cap, token_budget, citation_budget]
    SearchResultItem:
      type: object
      properties:
        title: { type: string, nullable: true }
        url: { type: string }
        content: { type: string }
        score: { type: number, format: float }
        published_at: { type: string, nullable: true }
        source: { type: string }
        highlight:
          type: string
          nullable: true
          description: Query-matched passage with `<b>…</b>` markers.
    ExtractRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        workspace_id: { type: string }
        persist: { type: boolean, default: true }
    TavilyExtractRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items: { type: string, format: uri }
        extract_depth: { type: string, enum: [basic, advanced] }
        format: { type: string, enum: [markdown, text] }
        include_images: { type: boolean }
        include_favicon: { type: boolean }
        workspace_id: { type: string }
    TavilyExtractResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              title: { type: string, nullable: true }
              raw_content: { type: string, nullable: true }
        failed_results:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              error: { type: string }
        unsupported_features:
          type: array
          items: { type: string }
        response_time: { type: number, format: double }
    IngestRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        source_key: { type: string }
        title: { type: string }
        content_type: { type: string }
        language: { type: string }
        workspace_id: { type: string }
        metadata: { type: object, additionalProperties: true }
    IngestBatchRequest:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngestRequest' }
        directory:
          type: object
          properties:
            files:
              type: array
              items:
                type: object
                required: [file_name, content]
                properties:
                  file_name: { type: string }
                  content: { type: string }
                  source_key: { type: string }
                  title: { type: string }
                  content_type: { type: string }
                  language: { type: string }
            recursive: { type: boolean }
            extensions:
              type: array
              items: { type: string }
    IngestedDocument:
      type: object
      properties:
        document_id: { type: string }
        version_id: { type: string }
        canonical_url: { type: string }
        source_type: { type: string, enum: [web, local_text, local_file, local_directory, local_mixed] }
        content_hash: { type: string }
        changed: { type: boolean }
        title: { type: string, nullable: true }
        chunk_count: { type: integer }
        status: { type: string }
        # RFC-087: absent when ingest-time redaction is disabled.
        redaction:
          allOf:
            - $ref: '#/components/schemas/RedactionReport'
          nullable: true
    RedactionReport:
      type: object
      description: >
        Secrets redacted at INGEST time (RFC-087). Rule counts are audit data;
        the marker [REDACTED:<rule>] replaces each match before storage.
      properties:
        redacted: { type: boolean }
        hits:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              count: { type: integer }
        rules_version: { type: string }
    ResearchRound:
      type: object
      properties:
        round: { type: integer }
        query: { type: string }
        trace_id: { type: string }
        status: { type: string }
        quality: { type: string }
        decision_path: { type: string }
        result_count: { type: integer }
        open_requirements: { type: integer }
        spent_micros: { type: integer, format: int64 }
    ResearchRun:
      type: object
      properties:
        session_id: { type: string }
        rounds:
          type: array
          items: { $ref: '#/components/schemas/ResearchRound' }
        evidence_count: { type: integer }
        open_requirements:
          type: array
          items: { type: object, additionalProperties: true }
        covered: { type: boolean }
        stopped:
          type: string
          enum: [covered, round_cap, budget_exhausted]
        total_spent_micros: { type: integer, format: int64 }
        final_response: { type: object, additionalProperties: true }
        PolicyVersionRow:
      type: object
      description: One append-only policy version (RFC-034).
      properties:
        id: { type: string }
        kind: { type: string, enum: [quality, freshness, source] }
        policy_id: { type: string }
        version: { type: integer, format: int64 }
        payload_json: { type: string }
        status: { type: string, enum: [active, retired] }
        notes: { type: string, nullable: true }
        created_at: { type: string }
        PolicyOverride:
      type: object
      description: Caller-supplied quality-policy override for simulation.
      properties:
        minimum_quality: { type: number, format: float, minimum: 0, maximum: 1 }
        minimum_coverage: { type: number, format: float, minimum: 0, maximum: 1 }
        minimum_distinct_sources: { type: integer }
    DecisionSnapshot:
      type: object
      properties:
        decision_path: { type: string }
        decision_reason: { type: string }
        final_outcome: { type: string, nullable: true }
        estimated_cost_micros: { type: integer, format: int64 }
        quality_status: { type: string }
        status: { type: string }
    ReplayOutcome:
      type: object
      properties:
        trace_id: { type: string }
        task_id: { type: string }
        query: { type: string }
        original: { $ref: '#/components/schemas/DecisionSnapshot' }
        replayed: { $ref: '#/components/schemas/DecisionSnapshot' }
        decision_changed: { type: boolean }
        quality_changed: { type: boolean }
        policy_applied: { type: boolean }
        baseline:
          allOf:
            - $ref: '#/components/schemas/DecisionSnapshot'
          nullable: true
        offline: { type: boolean }
        notes:
          type: array
          items: { type: string }
    EvaluationReport:
      type: object
      properties:
        evaluated: { type: integer }
        decision_changes: { type: integer }
        quality_changes: { type: integer }
        decision_agreement_rate: { type: number, format: float }
        policy_applied: { type: boolean }
        per_trace:
          type: array
          items: { $ref: '#/components/schemas/ReplayOutcome' }
        DeletionAuditEntry:
      type: object
      description: One append-only deletion-propagation audit row (RFC-087).
      properties:
        id: { type: string }
        document_id: { type: string }
        workspace_id: { type: string, nullable: true }
        content_hash: { type: string, nullable: true }
        chunk_count: { type: integer }
        outbox_events: { type: integer }
        index_verified: { type: boolean }
        cache_invalidated: { type: boolean }
        deleted_at: { type: string }
        IngestBatchResult:
      type: object
      properties:
        job_id: { type: string }
        state: { type: string, enum: [pending, running, completed, partial, failed] }
        total_items: { type: integer }
        ok_items: { type: integer }
        failed_items: { type: integer }
        documents:
          type: array
          items: { $ref: '#/components/schemas/IngestedDocument' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/IngestFailure' }
    IngestFailure:
      type: object
      properties:
        source_key: { type: string }
        error: { type: string }
    IngestJob:
      type: object
      properties:
        id: { type: string }
        workspace_id: { type: string }
        source_type: { type: string }
        state: { type: string }
        total_items: { type: integer }
        ok_items: { type: integer }
        failed_items: { type: integer }
        error_detail: { type: string, nullable: true }
        created_at: { type: string }
        finished_at: { type: string, nullable: true }
    IngestJobItem:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        source_key: { type: string }
        state: { type: string }
        document_id: { type: string, nullable: true }
        error_detail: { type: string, nullable: true }
    DocumentSummary:
      type: object
      properties:
        id: { type: string }
        source_id: { type: string }
        canonical_url: { type: string }
        current_version_id: { type: string, nullable: true }
        title: { type: string, nullable: true }
        content_type: { type: string }
        language: { type: string, nullable: true }
        source_type: { type: string }
        status: { type: string, enum: [discovered, fetched, normalized, indexed, deleted] }
        workspace_id: { type: string }
        version_count: { type: integer }
        chunk_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    DocumentVersion:
      type: object
      properties:
        id: { type: string }
        document_id: { type: string }
        content_hash: { type: string }
        raw_content_ref: { type: string }
        markdown_ref: { type: string, nullable: true }
        published_at: { type: string, nullable: true }
        fetched_at: { type: string }
        extractor_version: { type: string }
        crawler_version: { type: string, nullable: true }
        summary:
          type: string
          nullable: true
          description: Verbatim extractive summary computed at ingest (RFC-036).
        keywords:
          type: array
          items: { type: string }
    MemoryHit:
      type: object
      properties:
        entry:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            content: { type: string }
            url: { type: string, nullable: true }
        score: { type: number, format: float }
    SavingsReport:
      type: object
      properties:
        currency: { type: string }
        task_count: { type: integer }
        baseline_micros: { type: integer }
        searchos_micros: { type: integer }
        savings_micros: { type: integer }
        savings_rate: { type: number, format: float }
        quality_passing_tasks: { type: integer }
        cost_per_quality_passing_answer_micros: { type: integer, nullable: true }
        external_avoidance_rate: { type: number, format: float }
        valid_local_resolution_rate: { type: number, format: float }
        external_calls: { type: integer }
        local_resolved_tasks: { type: integer }
        reuse_views:
          type: object
          properties:
            original_acquisition_micros: { type: integer }
            reuse_execution_micros: { type: integer }
            amortized_micros: { type: integer }
            marginal_micros: { type: integer }
        is_estimate: { type: boolean }
    MetricsSnapshot:
      type: object
      description: In-process counters; local diagnostics, not an external monitor.
      additionalProperties: true
    DecisionTrace:
      type: object
      properties:
        trace_id: { type: string }
        task_id: { type: string }
        intents:
          type: array
          items: { type: string }
        profile_version: { type: string }
        local_candidates: { type: integer }
        accepted_candidates: { type: integer }
        freshness_status: { type: string }
        coverage_status: { type: string }
        source_status: { type: string }
        selected_path: { type: string }
        rejection_reasons:
          type: array
          items: { type: string }
        estimated_cost:
          type: object
          properties:
            amount_micros: { type: integer }
            currency: { type: string }
        actual_cost:
          type: object
          nullable: true
          properties:
            amount_micros: { type: integer }
            currency: { type: string }
        decision_at: { type: string }
        stages:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              status: { type: string }
              started_at_ms: { type: integer }
              duration_ms: { type: integer }
              input_summary: { type: string }
              output_summary: { type: string }
              reasons:
                type: array
                items: { type: string }
        final_strategy: { type: string, nullable: true }
        final_outcome: { type: string, nullable: true }
        federation_execution:
          allOf:
            - $ref: '#/components/schemas/FederationExecutionTrace'
          nullable: true
    FederationExecutionTrace:
      type: object
      description: >
        Per-source federation execution summary (RFC-062 §16). Present only when
        the federated executor ran sources for this task; null on the legacy
        path. The plan/selection chain explains why a source ran, this records
        what actually happened to it.
      properties:
        strategy:
          type: string
          enum: [legacy, plan_only, execute]
        planned_sources:
          type: array
          items: { type: string }
        executed_sources:
          type: array
          items: { type: string }
        failed_sources:
          type: array
          items: { type: string }
        timed_out_sources:
          type: array
          items: { type: string }
        not_executed_sources:
          type: array
          items: { type: string }
        candidates: { type: integer }
    SourceCatalog:
      type: object
      required: [strategy, projection, sources]
      properties:
        strategy:
          type: string
          enum: [legacy, plan_only, execute]
        projection:
          type: string
          enum: [live, persisted]
        sources:
          type: array
          items:
            type: object
            required: [source_id, category, enabled, billable]
            properties:
              source_id: { type: string }
              name: { type: string }
              category:
                type: string
                enum: [local_knowledge, web_search, web_document, file_system, agent_memory, conversation, knowledge_graph, vector_store, external_api, structured_database, custom]
              scope: { type: string }
              workspace_id: { type: string, nullable: true }
              enabled: { type: boolean }
              billable: { type: boolean }
              version: { type: string }
              health: { type: string, nullable: true }
              priority: { type: integer }
              estimated_cost_micros: { type: integer, format: int64 }
              timeout_ms: { type: integer, format: int64 }
              latency:
                type: object
                description: >
                  Declared timeout plus observed p50/p95 from live execution
                  feedback (RFC-080). Present on the live projection only.
                properties:
                  p50_ms: { type: integer, format: int64 }
                  p95_ms: { type: integer, format: int64 }
                  timeout_ms: { type: integer, format: int64 }
              reliability:
                type: object
                description: >
                  Live reliability feedback (RFC-080 slice). Present on the live
                  projection; absent from the persisted catalog projection.
                properties:
                  success_rate: { type: number, format: float }
                  circuit_open: { type: boolean }
                  consecutive_failures: { type: integer }
              capabilities:
                type: object
                additionalProperties: { type: boolean }
    SystemStatus:
      type: object
      properties:
        version: { type: string }
        api_version: { type: string }
        config_version: { type: integer }
        schema_version: { type: integer }
        database_ok: { type: boolean }
        index:
          type: object
          properties:
            tantivy_chunks: { type: integer }
            sqlite_chunks: { type: integer }
            consistent: { type: boolean }
        providers:
          type: array
          items: { type: string }
        crawlers: { type: integer }
        extensions: { type: integer }
        auth_required: { type: boolean }
        rate_limit_per_minute: { type: integer }
        federation:
          type: object
          description: >-
            RFC-062 federated source catalog. `legacy` means the kernel is
            not consulted by the search pipeline; the registry is still
            reported for diagnostics.
          properties:
            strategy: { type: string, enum: [legacy, plan_only, execute] }
            max_sources: { type: integer }
            max_parallel_sources: { type: integer }
            selection:
              type: string
              enum: [reliability_first, cost_adaptive]
              description: >-
                RFC-080 source ordering policy. `cost_adaptive` orders equally
                local / equally authoritative sources by expected quality per
                unit cost instead of configured priority.
            sources:
              type: array
              items:
                type: object
                properties:
                  source_id: { type: string }
                  category: { type: string }
                  enabled: { type: boolean }
                  billable: { type: boolean }
    DashboardMeta:
      type: object
      properties:
        generated_at: { type: string }
        time_range:
          type: object
          properties:
            from: { type: string, nullable: true }
            to: { type: string, nullable: true }
            timezone: { type: string }
        interval: { type: string }
        aggregation_version: { type: string }
        data_freshness: { type: string, enum: [complete, fresh, live, stale, empty] }
        query_mode:
          type: string
          enum: [precomputed, sql]
          description: precomputed = stored Read Model reused; sql = predicates pushed into a live query.
        applied_filters:
          type: array
          items: { type: string }
        ignored_filters:
          type: array
          items:
            type: object
            properties:
              filter: { type: string }
              reason: { type: string }
        refresh_skipped: { type: boolean }
        model_age_seconds: { type: integer, nullable: true }
        workspace_scope: { type: string }
