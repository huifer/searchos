# SearchOS Gateway API — OpenAPI 3.1 contract.
#
# This file is the frozen external contract. It is verified against the real
# Axum route table by the Rust test `openapi_spec_matches_the_route_table`
# (crates/searchos-interface-http), which fails when a documented path does
# not exist or a registered route is not documented. Do not edit one without
# the other.
#
# The same paths are mounted unversioned and under `/v1` (RFC-013 13.7); the
# `servers` list documents both mounts instead of duplicating every path.

openapi: 3.1.0
info:
  title: SearchOS Gateway API
  version: 0.2.0
  summary: Local-first AI search infrastructure gateway
  description: |
    SearchOS runs in two modes over the same core. Gateway Mode exposes this
    HTTP API: quality-gated search, URL extraction, local data ingestion,
    document lifecycle, namespaced memory, cost ledger, traces and the
    Analytics Read Model that backs the operator console.

    Every response is an explicit status envelope — partial or insufficient
    results are never disguised as `completed`. Estimated costs are labelled
    `is_estimate` and are never rewritten by billing reconciliation.

    The browser console never reads operational tables; it goes through
    `/api/v1/dashboard/*`.
  license:
    name: MIT
  contact:
    name: SearchOS
servers:
  - url: http://127.0.0.1:8787
    description: unversioned mount
  - url: http://127.0.0.1:8787/v1
    description: versioned mount (RFC-013 13.7)
tags:
  - name: Search
    description: Quality-gated search over local knowledge and external providers
  - name: Knowledge
    description: URL extraction, local ingestion and the document lifecycle
  - name: Memory
    description: Namespaced agent memory (workspace-isolated)
  - name: Cost
    description: Cost ledger, savings and budget reservations
  - name: Observability
    description: Traces, decisions, metrics and runtime status
  - name: Analytics
    description: RFC-026/027/028 Dashboard API over the Analytics Read Model
  - name: Evidence
    description: RFC-031 external acquisitions, promotion state and reuse accounting
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Observability]
      summary: Liveness plus index consistency
      security: []
      responses:
        '200':
          description: Gateway is serving and the index is consistent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format 0.0.4 (`text/plain; version=0.0.4`).
        Same authentication as every other endpoint — a scraper supplies the
        bearer token.

        The scrape carries both execution correctness (search, quality, cost,
        provider, outbox counters plus the Part 30 invariant metrics) and
        process health (`searchos_uptime_seconds`, `searchos_sse_active`,
        `searchos_index_outbox_pending`, `searchos_schema_version`,
        `searchos_build_info`). These are in-process counters; they are not a
        substitute for an external monitor, but they are the same numbers the
        console shows.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema: { type: string }
              example: |
                # HELP searchos_search_requests_total Total search requests received
                # TYPE searchos_search_requests_total counter
                searchos_search_requests_total 42
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /search/plan:
    post:
      tags: [Search]
      summary: Plan a search without executing it
      description: |
        Agent-facing plan: shows which queries WOULD be executed, the open
        requirements and the estimated cost. No external call is made, no
        provider is billed and no document is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Plan computed (nothing was executed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPlanReport'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search/follow-up:
    post:
      tags: [Search]
      summary: Continue an agent session on its open requirements
      description: |
        Continues a recorded session. Without `focus_requirements`, the turn
        targets exactly the requirements the previous turn left open (the
        `coverage_gaps` of that turn). The turn is recorded back into the
        session, so multi-turn research keeps its coverage state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Follow-up turn completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    post:
      tags: [Search]
      summary: Execute a search
      description: |
        Local-first: answers are served from the local index and memory before
        any external provider is called. The response status is explicit —
        `partial` / `insufficient_evidence` are never reported as `completed`.

        A Tavily-shaped body (`search_depth`, `topic`, `include_answer`,
        `include_raw_content`, `include_domains`, `exclude_domains`, `days`, …)
        is routed through the compatibility layer, which reports unsupported
        knobs back in `unsupported_features` explicitly instead of silently
        ignoring them. See `docs/tavily-compatibility.md` for the frozen subset.
        The compatibility layer only engages when the body contains a Tavily
        key; a plain `{ "query": ... }` body stays on the native contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search completed (status is in the body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /extract:
    post:
      tags: [Knowledge]
      summary: Fetch, extract and persist a URL
      description: |
        Native body: `{ "url": "...", "persist": true }`.

        Tavily-shaped body: `{ "urls": [...] }`. SearchOS extracts **one URL
        per call**: the first is honored, the rest are returned in
        `failed_results` with an explicit reason. `extract_depth` / `format` /
        `include_images` / `include_favicon` are reported in
        `unsupported_features` rather than silently ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ExtractRequest'
                - $ref: '#/components/schemas/TavilyExtractRequest'
      responses:
        '200':
          description: Extracted content, persisted unless `persist` is false.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: true
                  - $ref: '#/components/schemas/TavilyExtractResponse'
        '400': { $ref: '#/components/responses/ValidationError' }

  /ingest:
    post:
      tags: [Knowledge]
      summary: Import pasted or typed text
      description: |
        Feeds the same knowledge store as URL fetch: same versioning, chunking,
        workspace isolation and rebuild path. Re-importing the same
        `source_key` with unchanged content is a no-op (`changed: false`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '201':
          description: Imported document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedDocument'
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { $ref: '#/components/responses/ContentTooLarge' }

  /ingest/file:
    post:
      tags: [Knowledge]
      summary: Upload a text file
      description: |
        The client filename is a label only; it never touches the server
        filesystem. Content is decoded as strict UTF-8.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                workspace_id: { type: string }
                source_key: { type: string }
                title: { type: string }
                content_type: { type: string }
                language: { type: string }
      responses:
        '201':
          description: Imported document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedDocument'
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { $ref: '#/components/responses/ContentTooLarge' }

  /ingest/batch:
    post:
      tags: [Knowledge]
      summary: Import several documents in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBatchRequest'
      responses:
        '201':
          description: Per-item outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestBatchResult'
        '400': { $ref: '#/components/responses/ValidationError' }

  /ingest/jobs/{id}:
    get:
      tags: [Knowledge]
      summary: Batch job status
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job row plus one row per item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: '#/components/schemas/IngestJob' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IngestJobItem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents:
    get:
      tags: [Knowledge]
      summary: List documents
      description: |
        Live list, scoped to the caller's workspace. Soft-deleted rows are
        hidden unless `status=deleted` is requested explicitly, which exposes
        the audit trail.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: source_type
          in: query
          description: '`web`, `local` (any local kind), or an exact local_ kind.'
          schema: { type: string }
        - name: status
          in: query
          description: Lifecycle status, e.g. `normalized`, `indexed`, `deleted`.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Document summaries with version and chunk counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }
    post:
      tags: [Knowledge]
      summary: Fetch and persist a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                workspace_id: { type: string }
      responses:
        '200':
          description: Persisted document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /documents/{id}:
    get:
      tags: [Knowledge]
      summary: Document detail
      description: |
        Returns the document, a lifecycle summary (status, version/chunk
        counts), the current version and the full version history. A
        soft-deleted document is `404`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { type: object, additionalProperties: true }
                  summary: { $ref: '#/components/schemas/DocumentSummary' }
                  current_version: { $ref: '#/components/schemas/DocumentVersion' }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Knowledge]
      summary: Soft-delete a document
      description: |
        Soft delete plus chunk removal and full-text index removal (RFC-006
        6.7). The deletion is applied immediately, so the document is
        verifiably unsearchable afterwards. The row stays reachable through
        `GET /documents?status=deleted`.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  document_id: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /collections:
    get:
      tags: [Knowledge]
      summary: Workspace-scoped knowledge collections (RFC-030)
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Collections with LIVE (non-deleted) member counts.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [Knowledge]
      summary: Create (or fetch) a named collection (RFC-030)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                workspace_id: { type: string, default: default }
                description: { type: string }
      responses:
        '200':
          description: The collection (deterministic id).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /collections/{id}/documents:
    get:
      tags: [Knowledge]
      summary: Live document ids in a collection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Document ids (soft-deleted members hidden).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [Knowledge]
      summary: Add an existing document to a collection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id: { type: string }
      responses:
        '200':
          description: Membership added.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /collections/{id}/documents/{document_id}:
    delete:
      tags: [Knowledge]
      summary: Remove a collection membership (never the document)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: document_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /entities:
    get:
      tags: [Knowledge]
      summary: Registered entities and aliases (RFC-058)
      responses:
        '200':
          description: Alias read model + durable entities.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      tags: [Knowledge]
      summary: Register an entity with aliases (RFC-058)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonical_name]
              properties:
                canonical_name: { type: string }
                aliases:
                  type: array
                  items: { type: string }
                source: { type: string, enum: [operator, heuristic], default: operator }
      responses:
        '200':
          description: Registered entity plus conflicting aliases (first owner wins).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /entities/resolve:
    post:
      tags: [Knowledge]
      summary: Resolve text against registered aliases (RFC-058)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '200':
          description: The matched entity or null.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /research/run:
    post:
      tags: [Search]
      summary: Bounded deep-search research run (RFC-071)
      description: |
        Runs up to `max_rounds` full searches for one research task. Each
        round is recorded as a session turn; the final gate's open
        requirements become the next round's focus. Stops on coverage, the
        round cap, or TOTAL budget exhaustion. The workspace (turns +
        accumulated evidence) is durable and inspectable at
        `GET /research/{session_id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                profile: { type: string, default: general }
                mode: { type: string, enum: [local_only, local_first, hybrid, external_first, external_only] }
                workspace: { type: string, default: default }
                session_id: { type: string }
                max_rounds: { type: integer, minimum: 1, maximum: 8, default: 3 }
                max_total_cost_micros: { type: integer, format: int64, default: 100000 }
                max_external_queries: { type: integer, default: 5 }
      responses:
        '200':
          description: The bounded run (rounds, workspace totals, final response).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResearchRun' }
  /research/{session_id}:
    get:
      tags: [Search]
      summary: Research workspace (turns + accumulated evidence)
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/NotFound' }

  /memory/lifecycle:
    post:
      tags: [Memory]
      summary: Memory lifecycle — expire + consolidate (RFC-070)
      description: |
        Expires entries past `memory.retention_days` and merges duplicate
        content within one namespace+sharing (newest copy wins). `apply:
        false` (default) is a dry run: it reports what WOULD be removed and
        deletes nothing.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply: { type: boolean, default: false }
      responses:
        '200':
          description: Lifecycle report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expired: { type: integer }
                  expired_ids:
                    type: array
                    items: { type: string }
                  merged_groups: { type: integer }
                  removed_duplicates: { type: integer }
                  applied: { type: boolean }

  /policies:
    get:
      tags: [Policies]
      summary: Active policy versions (RFC-034)
      description: One active row per kind plus the live in-memory version stamp.
      responses:
        '200':
          description: Active policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyVersionRow' }
                  live: { type: object, additionalProperties: true }
  /policies/{kind}/versions:
    get:
      tags: [Policies]
      summary: Append-only policy history
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [quality, freshness, source] }
      responses:
        '200':
          description: Newest-first history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyVersionRow' }
        '400': { $ref: '#/components/responses/NotFound' }
  /policies/{kind}:
    put:
      tags: [Policies]
      summary: Submit and activate a new policy version (RFC-034)
      description: |
        Validates the payload, appends a new version, retires the previous
        active one and hot-reloads the runtime. The policy stamp changes, so
        cached answers built under the old policy are no longer reused.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [quality, freshness, source] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy]
              properties:
                policy: { type: object, additionalProperties: true }
                notes: { type: string }
      responses:
        '200':
          description: The newly activated version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionRow' }
        '400': { $ref: '#/components/responses/NotFound' }
  /policies/{kind}/rollback:
    post:
      tags: [Policies]
      summary: Reactivate an existing policy version (RFC-034)
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [quality, freshness, source] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: The reactivated version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionRow' }
        '400': { $ref: '#/components/responses/NotFound' }

  /replay/{trace_id}:
    post:
      tags: [Search]
      summary: Replay a recorded decision offline (RFC-040 / RFC-075)
      description: |
        Reconstructs the recorded request from search_tasks + the decision
        trace, then re-executes it with a FRESH request id and ZERO external
        queries. No provider is ever called. An optional `policy` object
        overrides quality thresholds for what-if simulation; the replay runs
        on an isolated service sharing all other state.
      parameters:
        - name: trace_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { $ref: '#/components/schemas/PolicyOverride' }
      responses:
        '200':
          description: Original vs replayed decision snapshots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplayOutcome' }
        '404': { $ref: '#/components/responses/NotFound' }

  /evaluation/replay:
    post:
      tags: [Search]
      summary: Aggregate replay evaluation (RFC-086)
      description: |
        Batches offline replays over the most recent recorded traces and
        reports decision agreement, quality changes and per-trace detail.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 200, default: 20 }
                workspace: { type: string }
                policy: { $ref: '#/components/schemas/PolicyOverride' }
      responses:
        '200':
          description: Evaluation report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluationReport' }

  /deletions:
    get:
      tags: [Knowledge]
      summary: Deletion-propagation audit (RFC-087)
      description: |
        Append-only proof of what each deletion propagated: metadata soft
        delete, chunk removal, enqueued index-delete events, whether the
        drain left the index verifiably clean (`index_verified`), and cache
        invalidation. Rows are never removed by the deletion path.
      parameters:
        - name: document_id
          in: query
          schema: { type: string }
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit rows, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletions:
                    type: array
                    items: { $ref: '#/components/schemas/DeletionAuditEntry' }

  /documents/{id}/versions:
    get:
      tags: [Knowledge]
      summary: Version history
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Immutable content versions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/DocumentSummary' }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentVersion' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/reindex:
    post:
      tags: [Knowledge]
      summary: Re-index a document
      description: |
        Rewrites only the full-text index entries. Metadata, the version row
        and the chunk rows are never rewritten, so the version count is
        unchanged.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Re-indexed chunk count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string }
                  reindexed: { type: integer, minimum: 0 }
                  version_count: { type: integer, minimum: 0 }
                  chunk_count: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/search:
    post:
      tags: [Knowledge]
      summary: Find documents by URL or title
      description: Metadata lookup over the document store, workspace-scoped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                workspace_id: { type: string }
                limit: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Matching documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/DocumentSummary' }

  /memory/search:
    post:
      tags: [Memory]
      summary: Search namespaced agent memory
      description: |
        Entries are visible only to the reading namespace (RFC-013 13.5).
        Retrieval is embedding plus BM25 fused with reciprocal rank fusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                workspace_id: { type: string }
                top_k: { type: integer, default: 10 }
      responses:
        '200':
          description: Ranked memory hits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/MemoryHit' }

  /cost/summary:
    get:
      tags: [Cost]
      summary: Cost ledger summary
      description: Estimated and actual totals; `is_estimate` is true until real bill data is reconciled.
      responses:
        '200':
          description: Cost summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /cost/providers:
    get:
      tags: [Cost]
      summary: Per-provider cost breakdown
      responses:
        '200':
          description: Provider rows.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /cost/savings:
    get:
      tags: [Cost]
      summary: Savings report against an external-only baseline
      responses:
        '200':
          description: Savings report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingsReport' }

  /cost/reservations:
    get:
      tags: [Cost]
      summary: Budget reservation ledger
      description: Reserve → execute → settle. Estimates are never rewritten.
      responses:
        '200':
          description: Reservations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reservations:
                    type: array
                    items: { type: object, additionalProperties: true }

  /cost/reconcile:
    post:
      tags: [Cost]
      summary: Import a provider bill line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cost_event_id, actual_cost_micros, source, currency]
              properties:
                cost_event_id: { type: string }
                actual_cost_micros: { type: integer, format: int64 }
                source: { type: string }
                currency: { type: string, default: USD }
      responses:
        '200': { description: Reconciled. }
        '404': { $ref: '#/components/responses/NotFound' }

  /stats/search:
    get:
      tags: [Observability]
      summary: Search metrics snapshot
      responses:
        '200':
          description: In-process metrics (local diagnostics, not an external monitor).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSnapshot' }

  /stats/savings:
    get:
      tags: [Cost]
      summary: Savings and reuse-cost views
      responses:
        '200':
          description: Savings report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavingsReport' }

  /stats/retrieval:
    get:
      tags: [Observability]
      summary: Retrieval statistics
      responses:
        '200':
          description: Retrieval counters.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /decisions/{trace_id}:
    get:
      tags: [Observability]
      summary: Decision trace
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Structured stage trace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trace/{trace_id}:
    get:
      tags: [Observability]
      summary: Decision trace (alias)
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Structured stage trace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /traces:
    get:
      tags: [Observability]
      summary: Recent decision traces
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Trace list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  traces:
                    type: array
                    items: { $ref: '#/components/schemas/DecisionTrace' }

  /system/status:
    get:
      tags: [Observability]
      summary: Runtime status
      responses:
        '200':
          description: Runtime status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

  /sources:
    get:
      tags: [Search]
      summary: List federated search sources (RFC-063)
      description: >-
        The federated source catalog, resolved for the caller's workspace.
        `enabled_only` filters disabled registrations; `persisted` reads the
        SQLite projection (what an operator audits after a restart) instead of
        the live in-process registry, which stays authoritative for execution.
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string, default: default }
        - name: enabled_only
          in: query
          schema: { type: boolean, default: false }
        - name: persisted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Source catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /watch/run:
    post:
      tags: [Search]
      summary: Run the search-quality watchdog (RFC-035)
      description: >-
        Reads the Analytics Read Model, applies configured thresholds and a
        trend check against the previous snapshot, optionally evaluates a
        labelled dataset, and appends the report to the snapshot log. An
        unavailable signal is `skipped`, never a pass. A regression is a
        RESULT (HTTP 200), not an error.
      responses:
        '200':
          description: Watch report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /watch/snapshots:
    get:
      tags: [Search]
      summary: List search-watch snapshots, newest first (RFC-035)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Append-only snapshot history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items: { $ref: '#/components/schemas/WatchReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profiles:
    get:
      tags: [Search]
      summary: List search profiles
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { type: object, additionalProperties: true }

  /profiles/{id}:
    get:
      tags: [Search]
      summary: Inspect one search profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /evidence/acquisitions:
    get:
      tags: [Evidence]
      summary: List external acquisitions and their promotion state
      description: |
        RFC-031 read-only observability. Promotion is an internal consequence
        of a search, so there is no write endpoint.
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
      responses:
        '200':
          description: Acquisitions plus promotion state counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acquisitions:
                    type: array
                    items: { type: object, additionalProperties: true }
                  stats: { type: object, additionalProperties: true }

  /evidence/acquisitions/{id}:
    get:
      tags: [Evidence]
      summary: Inspect one acquisition and its result items
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acquisition with per-item promotion state and reasons.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /evidence/reuse:
    get:
      tags: [Evidence]
      summary: Compound report — reuse events per acquisition
      parameters:
        - name: workspace_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Promotion counts and the compound ratio.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/dashboard/overview:
    get:
      tags: [Analytics]
      summary: Overview Read Model
      description: |
        Unfiltered requests reuse the precomputed Read Model and report
        `meta.query_mode: precomputed`; any time range, interval, workspace,
        agent, mode, provider or quality filter is pushed into SQL and reports
        `meta.query_mode: sql`. Filters a view cannot apply are listed in
        `meta.ignored_filters` with a reason — never silently dropped.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TimeRange'
        - $ref: '#/components/parameters/Interval'
      responses:
        '200':
          description: Overview KPIs with denominators and definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
                  meta: { $ref: '#/components/schemas/DashboardMeta' }

  /api/v1/dashboard/search/summary:
    get:
      tags: [Analytics]
      summary: Search requests Read Model
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Read Model envelope. }
  /api/v1/dashboard/search/requests:
    get:
      tags: [Analytics]
      summary: Search requests Read Model (alias)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Read Model envelope. }
  /api/v1/dashboard/search/timeseries:
    get:
      tags: [Analytics]
