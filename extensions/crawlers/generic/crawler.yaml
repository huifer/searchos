# Generic crawler strategy (RFC-010 10.5)
strategy:
  user_agent: "searchos/0.1 (+https://github.com/huifer/searchos)"
  max_redirects: 5
  timeout_ms: 15000
  max_response_bytes: 5242880
  robots:
    respect: true
  rate_limit:
    per_domain_concurrency: 4
    delay_ms: 500
  freshness:
    default_ttl_seconds: 86400
