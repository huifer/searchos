# Example SearchOS configuration
# 示例 SearchOS 配置
# This file is provided as a reference. Copy to ~/.searchos/config/config.yaml and edit.
# 本文件仅供参考。复制为 ~/.searchos/config/config.yaml 后按需修改。
# Validate with: searchos --format json config validate

config_version: 1             # RFC-019 19.4: schema version

app:
  name: searchos
  mode: standalone            # standalone | server | cluster
  data_dir: ~/.searchos

server:
  enabled: true
  host: 127.0.0.1
  port: 8787
  api_version: "1"            # explicit transport version; /v1 routes too
  rate_limit_per_minute: 600   # 0 disables; HTTP 429 when exceeded
  cors_origin: http://localhost:3100  # Next.js console origin; empty disables CORS
  # Bind a bearer token to exactly one workspace (RFC-017 17.6).
  # Leave empty for local dev; requires server.auth_token when non-empty.
  workspace_tokens: {}
  # token-a: ws-a
  # auth_token: from SEARCHOS_AUTH_TOKEN, never plaintext here

storage:
  metadata: sqlite            # sqlite | postgres
  fulltext: tantivy           # tantivy | elasticsearch | meilisearch | postgres | mysql
  vector: lancedb
  objects: local              # local | s3
  # Remote retrieval backends (only the backend selected by `fulltext` is
  # used; secrets come from the environment, never this file).
  # 远程检索后端（只有 fulltext 选中的后端会被使用；密钥一律走环境变量）。
  remote:
    elasticsearch:
      url: ""                   # e.g. http://127.0.0.1:9200
      api_key: ""               # or SEARCHOS_ES_API_KEY
      index: searchos_chunks
      timeout_seconds: 10
      verify_tls: true
    meilisearch:
      url: ""                   # e.g. http://127.0.0.1:7700
      api_key: ""               # or SEARCHOS_MEILI_API_KEY
      index: searchos_chunks
      timeout_seconds: 10
      verify_tls: true
    postgres:
      url: ""                   # e.g. postgres://user:pass@127.0.0.1:5432/searchos
      index: searchos_chunks_pg
      timeout_seconds: 10
      verify_tls: true
    mysql:
      url: ""                   # e.g. mysql://user:pass@127.0.0.1:3306/searchos
      index: searchos_chunks_my
      timeout_seconds: 10
      verify_tls: true

search:
  local_first: true
  semantic_dedup: true
  incremental: true
  max_external_queries: 3

ingest:
  max_bytes_per_document: 20971520   # 20 MB
  max_bytes_per_batch: 209715200    # 200 MB

memory:
  enabled: true
  embedding:
    # v0.1.1 ships a deterministic local HashingEmbedder. A non-local provider
    # logs a warning and falls back; no remote embedding model is wired yet.
    provider: local           # local | remote (remote = fallback + warning)
    model: bge-m3             # label only; the local embedder is model-free

intelligence:
  query_expansion: true
  # Gates the RRF result cache. Reranking itself does not run by default
  # (RFC-007 7.7): no Reranker provider is attached in v0.1.1.
  reranking: true
  answer_generation: false

indexes:
  rebuild_on_start: false
  verify_on_start: true

policies:
  default_profile: general
  minimum_quality: 0.6
  require_provenance: true

budgets:
  default_max_external_queries: 5
  default_max_total_cost_micros: 100000
  baseline_per_query_micros: 5000   # external-only baseline for savings reports

crawler:
  default_timeout_ms: 15000
  max_concurrent: 4
  respect_robots: true
  robots_unknown_allow: false      # RFC 9309: unreachable robots.txt disallows all
  crawl_delay_cap_seconds: 10

extensions:
  allow_native: true
  wasm_enabled: false          # ADR-024: later phase

security:
  ssrf_protection: true
  max_response_bytes: 10485760
  max_redirects: 5

observability:
  log_level: warn
  trace_retention_days: 30
  metrics_enabled: true
  # OpenTelemetry OTLP/HTTP export (off by default). GET /metrics is always
  # available with Prometheus text; OTLP is an additional, opt-in exporter.
  # Secrets (collector tokens) go in SEARCHOS_OTLP_HEADERS, never in this file.
  otlp_enabled: false
  otlp_endpoint: http://127.0.0.1:4318
  otlp_service_name: searchos
  otlp_metrics_interval_seconds: 15
  otlp_export_traces: true
  otlp_export_metrics: true

providers:
  tavily:
    enabled: true
    priority: 1
    # Multi-key rotation (RFC-009 9.7): list keys here or use
    # TAVILY_API_KEYS (comma/space separated). Rotation policy:
    # round_robin (default) | failover.
    # 多密钥轮询：在此列出密钥，或用 TAVILY_API_KEYS（逗号/空格分隔）。
    # rotation: round_robin
    # api_keys: ["tvly-xxx", "tvly-yyy"]
  brave:
    enabled: true
    priority: 2
    # rotation: round_robin
    # api_keys: ["BSA-xxx", "BSA-yyy"]
  # Production API keys should come from environment variables or a
  # secret store, never plaintext in this file.
  # 生产环境 API Key 应从环境变量或加密 Secret Store 注入，勿明文保存于此。
  # TAVILY_API_KEY / BRAVE_API_KEY are read from the environment;
  # TAVILY_API_KEYS / BRAVE_API_KEYS enable multi-key rotation.
