name: Setup protoc
description: Install the protobuf compiler required by the LanceDB build script

# `lance-encoding` runs prost-build at compile time. GitHub-hosted runners do
# not ship protoc, and `protobuf-compiler` alone is not enough: on Debian,
# `libprotobuf-dev` is only a Recommends, so the well-known includes such as
# google/protobuf/empty.proto are missing unless it is installed explicitly.
# Both packages are listed here so every Rust job builds the same way as the
# Dockerfile (see docs/deployment.md).
#
# The apt mirror occasionally fails to resolve (transient DNS on the runner),
# which fails every Rust job at once, so the install is retried.

runs:
  using: composite
  steps:
    - name: Install protobuf-compiler
      shell: bash
      run: |
        set -uo pipefail
        if command -v protoc >/dev/null 2>&1; then
          protoc --version
          exit 0
        fi
        for attempt in 1 2 3 4 5; do
          if sudo apt-get update -qq && \
             sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev; then
            protoc --version
            exit 0
          fi
          echo "apt attempt ${attempt} failed (mirror hiccup?); retrying in 15s"
          sleep 15
        done
        echo "::error::could not install protobuf-compiler after 5 attempts"
        exit 1
