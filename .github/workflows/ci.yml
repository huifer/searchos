name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # A workflow-file error fails the whole run in 0s with zero jobs (e.g. the
  # `secrets` context is not available in step-level `if:`). Lint the workflows
  # and composite actions so the release pipeline can never be silently red.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint -oneline

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (unlocks e2e suite)
        run: cargo build --workspace --locked
      - name: Unit + integration + suites
        env:
          # The e2e backup drill spawns the real binary. Cargo does not
          # guarantee where a test executable lives, so the harness reads
          # this explicit path instead of deriving one.
          SEARCHOS_BIN: ${{ github.workspace }}/target/debug/searchos
        run: cargo test --workspace --locked
      - name: Assert test catalogue did not drift
        run: |
          count=$(cargo test --workspace --locked -- --list | grep -c ': test$')
          echo "tests=$count"
          [ "$count" -ge 428 ]

  # Evaluation quality gate: real retrieval against the deterministic seed
  # corpus. Catches a regression that silently collapses keyword coverage.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --locked --bin searchos
      - name: Generate the deterministic seed corpus
        run: python3 fixtures/evaluations/generate_seed.py --limit 40
      - name: Ingest the seed corpora (EN + CJK)
        env:
          SEARCHOS_DATA_DIR: /tmp/searchos-eval
        run: |
          mkdir -p "$SEARCHOS_DATA_DIR"
          ./target/debug/searchos init
          ./target/debug/searchos ingest --dir fixtures/evaluations/seed
          ./target/debug/searchos ingest --dir fixtures/evaluations/seed_zh
      - name: Run the evaluation
        env:
          SEARCHOS_DATA_DIR: /tmp/searchos-eval
        run: |
          ./target/debug/searchos --format json eval run \
            --dataset fixtures/evaluations/dataset-v1.jsonl \
            --limit 20 --out eval-report.json
      - name: Assert quality thresholds
        run: python3 scripts/check_eval_gate.py eval-report.json
      - name: Run the CJK ranking evaluation
        env:
          SEARCHOS_DATA_DIR: /tmp/searchos-eval
        run: |
          ./target/debug/searchos --format json eval run \
            --dataset fixtures/evaluations/dataset-zh.jsonl \
            --limit 12 --out eval-report-zh.json
      - name: Assert CJK ranking thresholds (nDCG / MRR / Recall@5)
        run: |
          python3 scripts/check_eval_gate.py eval-report-zh.json \
            --min-questions 12 --min-mrr 0.8 --min-ndcg 0.8 --min-recall 0.8

  # Backup/restore drill: the operational rehearsal the deploy runbook
  # references. A broken restore must fail CI, not a recovery attempt.
  backup-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --locked --bin searchos
      - name: Run the backup/restore drill
        env:
          SEARCHOS_BIN: ${{ github.workspace }}/target/debug/searchos
        run: cargo test -p searchos-e2e-tests --test backup_restore --locked

  # The OpenAPI document is the frozen external contract. This job fails when
  # a registered route is not documented, or a documented path does not exist.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contract drift check
        run: cargo test -p searchos-interface-http --lib openapi_spec_matches_the_route_table
      - name: Route table resolves
        run: cargo test -p searchos-interface-http --lib every_registered_route_resolves
      - name: Route conflict scan
        run: |
          SRC_DIR=crates/searchos-interface-http/src bash scripts/scan-routes.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SDK contract parity
        run: python3 scripts/check_sdk_parity.py docs/openapi.yaml sdk/typescript/src/client.ts sdk/python/searchos/client.py
      - name: TypeScript SDK build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
      - name: Python SDK syntax + import check
        run: |
          python -m compileall -q sdk/python
          python -c "import sys; sys.path.insert(0, 'sdk/python'); from searchos import SearchOSClient, SearchOSError; print('python sdk import ok')"

  # Console unit tests (Vitest + Testing Library): client transport, proxy
  # multipart/auth, filter provenance, ingest and document lifecycle.
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
