# Release workflow.
#
# Trigger: pushing a `v<version>` tag (e.g. v0.1.0).
#
# What it does:
#   1. verify      — the same gates as CI, so a release can never ship red
#   2. artifacts   — release binary + SHA-256 checksums
#   3. images      — native per-arch builds on x86 and arm64 runners, merged
#                    into multi-arch manifests (no QEMU emulation)
#   4. release     — a GitHub release with the binary, checksums and the
#                    matching CHANGELOG section
#
# Version source of truth: the workspace `version` in Cargo.toml. The tag must
# match it (`v0.1.0` ↔ `version = "0.1.0"`), and this workflow asserts that so
# the tag, the binary, the OpenAPI document and the image tag cannot drift.
#
# Registry push: images are pushed to GHCR with the workflow's own
# `GITHUB_TOKEN` — the workflow already declares `packages: write`, so no
# extra repository secret is needed. Each architecture is built natively on
# its own runner (public repos get free `ubuntu-24.04-arm`), then a manifest
# list joins them. Cross-building arm64 under QEMU took hours and risked the
# job timeout. Newly created packages are private by default; flip them to
# public in GitHub → Packages if you want anonymous pulls.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the workspace version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python3 -c 'import re,sys; s=open("Cargo.toml").read(); print(re.search(r"^version = \"([^\"]+)\"", s, re.M).group(1))')"
          echo "tag=$tag_version manifest=$manifest_version"
          [ "$tag_version" = "$manifest_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $manifest_version"
            exit 1
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin searchos
      - name: Package and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="searchos-${version}-linux-x86_64"
          cp target/release/searchos "$asset"
          chmod +x "$asset"
          sha256sum "$asset" > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            searchos-*-linux-x86_64
            checksums.txt

  images:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "gateway=ghcr.io/${repo}/gateway"
            echo "console=ghcr.io/${repo}/console"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build gateway image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target gateway \
            --tag "${{ steps.tags.outputs.gateway }}:${{ steps.tags.outputs.version }}-${{ matrix.arch }}" \
            --file Dockerfile \
            --push .
      - name: Build console image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target console \
            --tag "${{ steps.tags.outputs.console }}:${{ steps.tags.outputs.version }}-${{ matrix.arch }}" \
            --file Dockerfile \
            --push .

  # Join the two native builds into the multi-arch tag the runbook documents.
  images-manifest:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Image names
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "gateway=ghcr.io/${repo}/gateway"
            echo "console=ghcr.io/${repo}/console"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch manifests
        run: |
          set -euo pipefail
          v="${{ steps.tags.outputs.version }}"
          g="${{ steps.tags.outputs.gateway }}"
          c="${{ steps.tags.outputs.console }}"
          docker buildx imagetools create -t "${g}:${v}" "${g}:${v}-amd64" "${g}:${v}-arm64"
          docker buildx imagetools create -t "${c}:${v}" "${c}:${v}-amd64" "${c}:${v}-arm64"
          docker buildx imagetools inspect "${g}:${v}"
          docker buildx imagetools inspect "${c}:${v}"

  release:
    needs: [artifacts, images-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Extract the changelog section for this tag
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" >> "$GITHUB_OUTPUT" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.M | re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"no CHANGELOG section for {version}")
          body = match.group(1).strip()
          with open("release-notes.md", "w") as handle:
              handle.write(body)
          print("body<<EOF")
          print(body)
          print("EOF")
          PY
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/searchos-*-linux-x86_64
            dist/checksums.txt
          fail_on_unmatched_files: true
