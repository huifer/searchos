# One-shot maintenance workflow: republish an already released multi-arch
# manifest under the documented, simple GHCR names.
#
# Why: the first release workflow derived image names from
# `${GITHUB_REPOSITORY}` (`huifer/searchos`), producing
# `ghcr.io/huifer/searchos/gateway:<v>` instead of the documented
# `ghcr.io/huifer/searchos-gateway:<v>`. `imagetools create` copies the
# manifest by reference — no rebuild, no QEMU, seconds instead of hours.
#
# Run: gh workflow run ghcr-aliases.yml -f version=0.1.1

name: ghcr-aliases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already published version, WITHOUT the leading v"
        required: true
        default: "0.1.1"

permissions:
  packages: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy manifests to the documented names
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for svc in gateway console; do
            src="ghcr.io/${owner}/searchos/${svc}:${VERSION}"
            dst="ghcr.io/${owner}/searchos-${svc}:${VERSION}"
            docker buildx imagetools create -t "${dst}" "${src}"
            docker buildx imagetools inspect "${dst}"
          done
